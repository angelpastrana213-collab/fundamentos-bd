<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Producto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="form-container">
        <a href="/productos" class="btn-back">&larr; Volver a Productos</a>

        <h2>Agregar Nuevo Producto</h2>

        <form action="/agregar_producto" method="POST">
            <div class="form-group">
                <label for="nombre">Nombre del Producto</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Café Americano" required>
            </div>

            <div class="form-group">
                <label for="categoria">Categoría</label>
                <select id="categoria" name="categoria" required>
                    <option value="" disabled selected>Selecciona una categoría</option>
                    <option value="Bebidas Calientes">Bebidas Calientes</option>
                    <option value="Bebidas Frías">Bebidas Frías</option>
                    <option value="Postres">Postres</option>
                    <option value="Snacks">Snacks</option>
                </select>
            </div>

            <div class="form-group">
                <label for="precio">Precio ($)</label>
                <input type="number" step="0.01" id="precio" name="precio" placeholder="0.00" required>
            </div>

            <div class="form-group">
                <label for="stock">Stock Inicial</label>
                <input type="number" id="stock" name="stock" placeholder="0" required>
            </div>

            <button type="submit" class="btn btn-submit">Guardar Producto</button>
        </form>
    </div>

</body>
</html>
