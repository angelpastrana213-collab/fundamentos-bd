<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos - Cafetería</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Catálogo de Productos</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Stock</th>
                </tr>
            </thead>
            <tbody>
                {% for prod in productos %}
                <tr>
                    <td>{{ prod.ID }}</td>
                    <td>{{ prod.Producto }}</td>
                    <td>{{ prod.Categoría }}</td>
                    <td>${{ "%.2f"|format(prod.Precio) }}</td>
                    <td>{{ prod.Stock }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <br>
        <a href="/" class="btn-secondary">Volver al Inicio</a>
    </div>
</body>
</html>
